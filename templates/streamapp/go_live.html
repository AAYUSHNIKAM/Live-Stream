{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Go Live{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Start a Live Stream</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-danger w-100 mt-3">Start Streaming</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
