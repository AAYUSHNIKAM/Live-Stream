{% extends 'base.html' %}

{% block title %}Welcome{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 text-center">
        <h1 class="display-4 mb-4">Welcome to LiveStream</h1>
        <p class="lead mb-5">Stream live videos and watch others in real-time</p>
        
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4 gap-3">Login</a>
            <a href="{% url 'signup' %}" class="btn btn-outline-secondary btn-lg px-4">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
